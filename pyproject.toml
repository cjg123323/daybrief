[project]
name = "daybrief"
version = "0.1.0"
description = "Personal daily research briefing agent: papers, institution news, notices, project progress."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "selectolax>=1.0",
  "python-dateutil>=2.9",
  "tzdata>=2024.1",   # Windows에는 시스템 시간대 DB가 없어 zoneinfo("Asia/Seoul")가 실패함
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
profile = ["pypdf>=4"]   # init-profile에서 PDF 읽기 (선택)
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
daybrief = "daybrief.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daybrief"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
