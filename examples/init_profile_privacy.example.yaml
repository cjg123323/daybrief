# daybrief init-profile --privacy 예시 (가짜 값). 실제 파일은 개인 레포(daybrief-me)에 둘 것.
# 사용: daybrief init-profile --roots D:\research --out-dir ../daybrief-me --privacy ../daybrief-me/init_profile_privacy.yaml --preview

# 수집하지 않을 경로 (glob, 대소문자 무시, 구분자는 / 로 써도 됨).
# PDF·.bib·git 레포에만 적용. 그 폴더에서 나눈 Claude Code 대화는 작업 근거라 남는다.
exclude:
  - "*/my-project/docs/internal/*"        # 내부 구상 문서
  - "*/manuscript/draft_v1.pdf"          # 원고 옛 버전 (최신 하나만 남기기)
  - "*/manuscript/submitted/*"

# 본문과 파일명에서 [NAME]으로 바꿀 이름. 한글은 '홍 길 동'처럼 글자 사이 공백도 잡는다.
redact:
  - 홍길동
  - Gildong Hong
